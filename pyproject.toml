[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controltrace"
version = "0.2.5"
description = "Synthetic IT audit evidence and internal control testing workbench"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dev-belly" }]
dependencies = [
  "duckdb>=1.1,<2",
  "pandas>=2.2,<3",
  "streamlit>=1.51,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
controltrace = "controltrace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/controltrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
